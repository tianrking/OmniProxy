<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>OmniProxy · Reproduction Workbench</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<body>
<a class="skip-link" href="#content">跳到主内容</a>
<aside class="sidebar">
  <a class="brand" href="#overview" aria-label="OmniProxy 首页"><span class="brand-mark">◈</span><span>OmniProxy<small>REPRODUCTION WORKBENCH</small></span></a>
  <div class="nav-caption">工作空间</div>
  <nav aria-label="主导航">
    <button data-view="overview"><span class="nav-icon">▦</span> 概览 <span class="nav-shortcut">01</span></button>
    <button data-view="captures"><span class="nav-icon">⇄</span> 流量录制 <span class="nav-shortcut">02</span></button>
    <button data-view="scenarios"><span class="nav-icon">◇</span> 场景与故障 <span class="nav-shortcut">03</span></button>
    <button data-view="reports"><span class="nav-icon">▤</span> 回归报告 <span class="nav-shortcut">04</span></button>
  </nav>
  <div class="sidebar-note"><span class="pulse-dot"></span><strong>本地优先，可重复验证</strong><p>把一次偶发问题，变成每次都能运行的测试。</p><span class="mono">CAPTURE → REPRODUCE → VERIFY</span></div>
  <div class="sidebar-bottom"><span class="avatar">OP</span><div><strong>本地工作空间</strong><small id="workspace-label">正在连接…</small></div><span class="connection-dot" id="connection-dot"></span></div>
</aside>
<div class="shell">
  <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="breadcrumb">概览</strong></div><div class="top-actions"><span id="connection" class="badge muted">连接中</span><button class="icon-button" id="theme" aria-label="切换深浅主题" title="切换深浅主题">◐</button><button class="quiet" id="refresh">↻ 刷新</button></div></header>
  <main id="content" tabindex="-1"><div class="loading"><span class="spinner"></span> 正在读取工作空间…</div></main>
  <footer class="page-footer"><span>OMNIPROXY <span id="version"></span> <span class="footer-separator">/</span> 开发者的网络实验台</span><span>本机运行 · 场景可导出 · 报告可接入 CI</span></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-capture" accept=".jsonl,.ndjson,.txt" hidden>
<input type="file" id="import-scenario" accept=".json" hidden>
</body></html>
